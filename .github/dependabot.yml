version: 2

updates:
  - package-ecosystem: 'uv'
    directory: '/api'
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'
    groups:
      flask:
        patterns:
          - 'flask'
          - 'flask-*'
          - 'werkzeug'
          - 'gunicorn'
      google:
        patterns:
          - 'google-*'
          - 'googleapis-*'
      opentelemetry:
        patterns:
          - 'opentelemetry-*'
      pydantic:
        patterns:
          - 'pydantic'
          - 'pydantic-*'
      llm:
        patterns:
          - 'langfuse'
          - 'langsmith'
          - 'litellm'
          - 'mlflow*'
          - 'opik'
          - 'weave*'
          - 'arize*'
          - 'tiktoken'
          - 'transformers'
      database:
        patterns:
          - 'sqlalchemy'
          - 'psycopg2*'
          - 'psycogreen'
          - 'redis*'
          - 'alembic*'
      storage:
        patterns:
          - 'boto3*'
          - 'botocore*'
          - 'azure-*'
          - 'bce-*'
          - 'cos-python-*'
          - 'esdk-obs-*'
          - 'google-cloud-storage'
          - 'opendal'
          - 'oss2'
          - 'supabase*'
          - 'tos*'
      vdb:
        patterns:
          - 'alibabacloud*'
          - 'chromadb'
          - 'clickhouse-*'
          - 'clickzetta-*'
          - 'couchbase'
          - 'elasticsearch'
          - 'opensearch-py'
          - 'oracledb'
          - 'pgvect*'
          - 'pymilvus'
          - 'pymochow'
          - 'pyobvector'
          - 'qdrant-client'
          - 'intersystems-*'
          - 'tablestore'
          - 'tcvectordb'
          - 'tidb-vector'
          - 'upstash-*'
          - 'volcengine-*'
          - 'weaviate-*'
          - 'xinference-*'
          - 'mo-vector'
          - 'mysql-connector-*'
      dev:
        patterns:
          - 'coverage'
          - 'dotenv-linter'
          - 'faker'
          - 'lxml-stubs'
          - 'basedpyright'
          - 'ruff'
          - 'pytest*'
          - 'types-*'
          - 'boto3-stubs'
          - 'hypothesis'
          - 'pandas-stubs'
          - 'scipy-stubs'
          - 'import-linter'
          - 'celery-types'
          - 'mypy*'
          - 'pyrefly'
      python-packages:
        patterns:
          - '*'
  # Prism's pinned third-party images in docker/docker-compose.prism.yaml.
  # Checked daily: these are the internet-facing and data services, where
  # security releases matter. Only the images Prism pins are allowed, so the
  # Dify-owned pins in docker-compose.yaml are left to Dify syncs. Major
  # versions are ignored: a new postgres or redis major needs a data
  # migration, and new nginx/squid majors deserve a deliberate change.
  - package-ecosystem: 'docker-compose'
    directory: '/docker'
    target-branch: 'main'
    open-pull-requests-limit: 5
    schedule:
      interval: 'daily'
    allow:
      - dependency-name: 'nginx'
      - dependency-name: 'ubuntu/squid'
      - dependency-name: 'certbot/certbot'
      - dependency-name: 'postgres'
      - dependency-name: 'redis'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 5
    schedule:
      interval: 'weekly'
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'uv'
