<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Rationale Agent (standalone)</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a2f3f;
    --text: #e7e9ee; --text-dim: #9aa1b2; --accent: #7c9eff; --accent-dim: #3a4a7a;
    --error: #e0645a;
    --kind-discovery: #7c9eff; --kind-retrieval: #4caf7d; --kind-fetch: #e0a94a;
    --kind-diff: #c47ce0; --kind-verify: #e0645a; --kind-other: #9aa1b2;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--text-dim); font-size: 12px; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
  }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 6px; }
  .tools-hint { font-size: 11px; color: var(--text-dim); margin: 0 0 12px; line-height: 1.4; }
  .tool-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .tool-card .name { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .tool-card .kind {
    display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 10px;
    margin-left: 6px; font-weight: 600; color: #0a0e1a; background: var(--kind-color, var(--kind-other));
  }
  .tool-card .desc { font-size: 11px; color: var(--text-dim); margin-top: 5px; line-height: 1.4; }
  .skills { margin-top: 18px; }
  .skills summary {
    cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); user-select: none;
  }
  .skill-block { margin-top: 10px; }
  .skill-block h3 { font-size: 11px; color: var(--text); margin: 0 0 4px; }
  .skill-block pre {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); white-space: pre-wrap;
    word-break: break-word; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px; margin: 0; line-height: 1.45; max-height: 340px; overflow-y: auto;
  }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .controls {
    padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0;
  }
  select, input[type=text] {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: var(--sans);
  }
  select { flex-shrink: 0; min-width: 180px; }
  input[type=text] { flex: 1; }
  button {
    background: var(--accent); color: #0a0e1a; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: var(--accent-dim); color: var(--text-dim); cursor: default; }
  .conversation { flex: 1; overflow-y: auto; padding: 20px; }
  .turn { max-width: 780px; margin: 0 auto 28px; }
  .turn .q { font-size: 14px; color: var(--text-dim); margin-bottom: 10px; }
  .turn .q strong { color: var(--text); }
  .answer {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .answer a { color: var(--accent); }
  .trace { margin-top: 10px; }
  .trace summary {
    cursor: pointer; font-size: 12px; color: var(--text-dim); user-select: none;
  }
  .trace-item {
    font-family: var(--mono); font-size: 11.5px; padding: 8px 10px; margin-top: 6px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  }
  .trace-item .tool-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .trace-item .tool-name { color: var(--accent); }
  .trace-item .forced { color: var(--error); font-family: var(--sans); font-size: 10.5px; }
  .trace-item .args { color: var(--text-dim); margin-top: 4px; word-break: break-all; }
  .trace-item .preview { color: var(--text-dim); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .loading { color: var(--text-dim); font-size: 13px; padding: 4px 0; }
  .error-box {
    background: #2a1616; border: 1px solid var(--error); color: #ffb3ac;
    border-radius: 8px; padding: 12px 14px; font-size: 13px; font-family: var(--mono); white-space: pre-wrap;
  }
</style>
</head>
<body>
<header>
  <h1>Decision Rationale Agent</h1>
  <span class="sub">standalone local UI for ask_decision_agent.py -- not Dify Studio</span>
</header>
<div class="layout">
  <div class="sidebar">
    <h2>Tools (all hand-made -- none are in Dify's native tool picker)</h2>
    <p class="tools-hint">Descriptions below are the model's actual tool instructions, not a separate summary.</p>
    <div id="tools"></div>
    <details class="skills">
      <summary>Skill (how the tools get combined)</summary>
      <div id="skills"></div>
    </details>
  </div>
  <div class="main">
    <div class="controls">
      <select id="draft"><option value="">(let the agent discover)</option></select>
      <input id="query" type="text" placeholder="Why was INIT_CWND set to 4?" />
      <button id="ask">Ask</button>
    </div>
    <div class="conversation" id="conversation"></div>
  </div>
</div>
<script>
const toolsEl = document.getElementById('tools');
const draftEl = document.getElementById('draft');
const queryEl = document.getElementById('query');
const askBtn = document.getElementById('ask');
const convEl = document.getElementById('conversation');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function linkify(text) {
  return escapeHtml(text).replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

async function loadTools() {
  const res = await fetch('/api/tools');
  const tools = await res.json();
  toolsEl.innerHTML = tools.map(t => `
    <div class="tool-card">
      <div>
        <span class="name">${escapeHtml(t.name)}</span>
        <span class="kind" style="--kind-color: var(--kind-${escapeHtml(t.kind)})">${escapeHtml(t.kind)}</span>
      </div>
      <div class="desc">${escapeHtml(t.description)}</div>
    </div>
  `).join('');
}

async function loadSkills() {
  const res = await fetch('/api/skills');
  const skills = await res.json();
  const skillsEl = document.getElementById('skills');
  skillsEl.innerHTML = `
    <div class="skill-block">
      <h3>Main agent</h3>
      <pre>${escapeHtml(skills.agent)}</pre>
    </div>
    <div class="skill-block">
      <h3>verify_answer fact-checker</h3>
      <pre>${escapeHtml(skills.verify)}</pre>
    </div>
  `;
}

async function loadDrafts() {
  const res = await fetch('/api/corpora');
  const data = await res.json();
  for (const c of data.catalog) {
    const opt = document.createElement('option');
    opt.value = c.draft_name;
    opt.textContent = c.rfc_number ? `${c.draft_name} (RFC ${c.rfc_number})` : c.draft_name;
    draftEl.appendChild(opt);
  }
}

function renderTrace(trace) {
  if (!trace || !trace.length) return '';
  const items = trace.map(t => `
    <div class="trace-item">
      <div class="tool-line">
        <span class="tool-name">${escapeHtml(t.tool)}</span>
        ${t.forced ? '<span class="forced">[safety-net forced]</span>' : ''}
      </div>
      <div class="args">${escapeHtml(JSON.stringify(t.args))}</div>
      <div class="preview">${escapeHtml(t.observation_preview || '')}</div>
    </div>
  `).join('');
  return `<details class="trace"><summary>${trace.length} tool call(s) -- click to inspect</summary>${items}</details>`;
}

async function ask() {
  const query = queryEl.value.trim();
  if (!query) return;
  askBtn.disabled = true;

  const turn = document.createElement('div');
  turn.className = 'turn';
  const draftLabel = draftEl.value ? ` <em>(draft: ${escapeHtml(draftEl.value)})</em>` : '';
  turn.innerHTML = `<div class="q"><strong>Q:</strong> ${escapeHtml(query)}${draftLabel}</div><div class="loading">Thinking…</div>`;
  convEl.appendChild(turn);
  turn.scrollIntoView({behavior: 'smooth'});

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, draft: draftEl.value || null}),
    });
    const data = await res.json();
    if (!res.ok) {
      turn.innerHTML = turn.querySelector('.q').outerHTML + `<div class="error-box">${escapeHtml(data.error || 'Unknown error')}</div>`;
    } else {
      turn.innerHTML = turn.querySelector('.q').outerHTML
        + `<div class="answer">${linkify(data.answer)}</div>`
        + renderTrace(data.trace);
    }
  } catch (e) {
    turn.innerHTML = turn.querySelector('.q').outerHTML + `<div class="error-box">${escapeHtml(String(e))}</div>`;
  } finally {
    askBtn.disabled = false;
    queryEl.value = '';
    turn.scrollIntoView({behavior: 'smooth'});
  }
}

askBtn.addEventListener('click', ask);
queryEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });

loadTools();
loadSkills();
loadDrafts();
</script>
</body>
</html>
