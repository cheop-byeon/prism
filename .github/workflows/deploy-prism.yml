name: Deploy Prism

# Every push to main: test -> staging -> smoke test -> production -> smoke
# test. A stage only runs if the one before it passed, so production only
# ever gets a commit that passed the tests and is already up on staging.
#
# Both VMs accept one shared SSH key whose forced command is
# deploy/ci-deploy (see that file): the key can do nothing but deploy the
# commit sha sent below. Its private half and the login user are repository
# secrets (Settings -> Secrets and variables -> Actions): PRISM_SSH_ACTION,
# PRISM_SSH_USER. What differs per VM is in environment secrets (Settings ->
# Environments -> staging / production): PRISM_SSH_HOST and
# PRISM_SSH_FINGERPRINT. The action's Go SSH client prefers ECDSA, then RSA,
# over ED25519 host keys, so this is the fingerprint of the first of those the
# VM offers (`ssh-keyscan -t ecdsa,rsa localhost`), e.g.
# `ssh-keygen -lf /etc/ssh/ssh_host_rsa_key.pub | awk '{print $2}'`.
# An environment secret overrides a repository secret of the same name.
#
# Off switch: the deploy stages run only while the repository variable
# PRISM_AUTODEPLOY is "true" (Settings -> Secrets and variables -> Actions
# -> Variables); tests still run either way.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# One pipeline at a time, never cancelled midway: a newer push waits until
# the running deploy finishes.
concurrency:
  group: deploy-prism
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/prism-tests.yml

  deploy-staging:
    needs: test
    if: vars.PRISM_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: staging
      url: https://staging.prism.uiocloud.no
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy ${{ github.sha }} to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRISM_SSH_HOST }}
          username: ${{ secrets.PRISM_SSH_USER }}
          key: ${{ secrets.PRISM_SSH_ACTION }}
          fingerprint: ${{ secrets.PRISM_SSH_FINGERPRINT }}
          # A full rebuild has taken 45-115 minutes on these VMs.
          command_timeout: 150m
          script: deploy ${{ github.sha }}

      - name: Smoke test staging
        run: .github/scripts/prism-smoke-test.sh https://staging.prism.uiocloud.no

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: production
      url: https://prism.uiocloud.no
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy ${{ github.sha }} to production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRISM_SSH_HOST }}
          username: ${{ secrets.PRISM_SSH_USER }}
          key: ${{ secrets.PRISM_SSH_ACTION }}
          fingerprint: ${{ secrets.PRISM_SSH_FINGERPRINT }}
          # A full rebuild has taken 45-115 minutes on these VMs.
          command_timeout: 150m
          script: deploy ${{ github.sha }}

      - name: Smoke test production
        run: .github/scripts/prism-smoke-test.sh https://prism.uiocloud.no
