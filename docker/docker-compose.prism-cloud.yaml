# Cloud-deployment-only override. Two things, both scoped to this VM's
# public domain (prism.uiocloud.no, matching NGINX_SERVER_NAME/the nginx
# TLS cert in docker/.env -- update every occurrence below if that domain
# ever changes):
#
# 1. PRISM_URL_PREFIX so Prism registers its Flask routes under /prism
#    instead of the root, matching the nginx /prism location added to
#    docker/nginx/conf.d/default.conf.template.
#
# 2. CONSOLE_API_URL/CONSOLE_WEB_URL/SERVICE_API_URL/APP_API_URL/APP_WEB_URL
#    overridden to the public HTTPS domain on every service that reads
#    them. docker/.env and docker-compose.override.yaml are both
#    gitignored, so they ship with their dev-only localhost/empty values
#    on every clone including this VM's -- api's CONSOLE_API_URL:
#    'http://localhost:5001' in docker-compose.override.yaml is exactly
#    why Prism's login page tried to reach the *browser's own* localhost
#    instead of this server. Since this file is loaded last (see the -f
#    order below), its values win over docker-compose.override.yaml's for
#    the same keys.
#    Must be https:// and the domain name, not the bare floating IP over
#    http:// -- nginx only terminates TLS for the domain (its cert is
#    issued for prism.uiocloud.no, not the IP), and a browser on an
#    https:// page blocks calls to a plain http:// API as mixed content,
#    so the raw-IP http:// form silently fails in the browser even though
#    it responds fine to curl on the server itself.
#
# Both deliberately kept out of docker-compose.ietf-ui.yaml/
# docker-compose.override.yaml (used by local dev too, where everything is
# reached directly at localhost with no prefix) -- add this file's -f flag
# only on the deployment VM:
#
#   docker compose \
#     -f docker-compose.yaml \
#     -f docker-compose.override.yaml \
#     -f docker-compose.ietf-ui.yaml \
#     -f docker-compose.prism-cloud.yaml \
#     up -d
x-cloud-urls: &cloud-urls
  CONSOLE_API_URL: https://prism.uiocloud.no
  CONSOLE_WEB_URL: https://prism.uiocloud.no
  SERVICE_API_URL: https://prism.uiocloud.no
  APP_API_URL: https://prism.uiocloud.no
  APP_WEB_URL: https://prism.uiocloud.no

services:
  ietf_decision_agent_ui:
    environment:
      <<: *cloud-urls
      PRISM_URL_PREFIX: /prism

  api:
    environment: *cloud-urls

  worker:
    environment: *cloud-urls

  worker_beat:
    environment: *cloud-urls

  web:
    environment:
      CONSOLE_API_URL: https://prism.uiocloud.no
      APP_API_URL: https://prism.uiocloud.no
      # Links Dify's own account-menu "Support" submenu out to Prism (see
      # web/app/components/header/account-dropdown/support.tsx) -- unset
      # anywhere else, so this is a no-op for every other Dify deployment.
      # Spectrum lives at PRISM_URL_PREFIX itself on this same origin;
      # classic moved to PRISM_URL_PREFIX + /classic/ (see the nginx /prism
      # location's own comment in default.conf.template for why).
      NEXT_PUBLIC_PRISM_CLASSIC_URL: https://prism.uiocloud.no/prism/classic/
      NEXT_PUBLIC_PRISM_SPECTRUM_URL: https://prism.uiocloud.no/prism/
