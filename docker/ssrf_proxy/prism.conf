# Prism's addition to Dify's squid config, mounted by docker-compose.prism.yaml
# into /etc/squid/conf.d/, which squid.conf.template includes just before its
# final `http_access deny all`. Lets Dify's outbound calls reach services on
# the Docker host, such as a host-level Ollama at host.docker.internal:11434.
acl local_host dstdomain host.docker.internal
http_access allow local_host
