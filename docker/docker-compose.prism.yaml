# Prism's additions to Dify's docker-compose.yaml, which stays exactly as
# upstream ships it so that syncing a new Dify release doesn't conflict here.
# Load this file last, after the base file and the machine's own
# docker-compose.override.yaml, so its settings win:
#
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml \
#     -f docker-compose.prism.yaml ...
#
# deploy/rebuild, deploy/renew-cert and the dev/ scripts already do. For
# ad-hoc commands, set COMPOSE_FILE in docker/.env so a bare `docker compose`
# loads the same set:
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.override.yaml:docker-compose.prism.yaml
#
# Compose merges this file into the base one: environment entries and volumes
# are added to (or replace) the base service's, and new services are added.
#
# Settings read from docker/.env:
#   ALLOW_REGISTER            allow self-service email/password sign-up (default false)
#   ALLOW_CREATE_WORKSPACE    give a newly registered account its own workspace (default false)
#   IETFDATA_SERVICE_URL      the ietfdata_service sidecar (default http://ietfdata_service:8010)
#   IETFDATA_SERVICE_TIMEOUT  seconds (default 60)
#   IETFDATA_LOGLEVEL         sidecar log level (default INFO)

# Since Dify 1.15 the API image builds from the repo root, as web has since
# 1.14 (it needs dify-agent/ beside api/); api/Dockerfile.dockerignore and
# web/Dockerfile.dockerignore keep the rest of the repo, docker/volumes
# included, out of the build context. Set here rather than in each
# machine's override, which predates both.
x-prism-api-build: &prism-api-build
  context: ..
  dockerfile: api/Dockerfile

x-prism-env: &prism-env
  ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
  ALLOW_CREATE_WORKSPACE: ${ALLOW_CREATE_WORKSPACE:-false}
  IETFDATA_SERVICE_URL: ${IETFDATA_SERVICE_URL:-http://ietfdata_service:8010}
  IETFDATA_SERVICE_TIMEOUT: ${IETFDATA_SERVICE_TIMEOUT:-60}

# Third-party images are pinned to an exact version and digest, rather than
# Dify's floating tags (nginx:latest, postgres:15-alpine, ...), which are only
# downloaded once and then go stale. Dependabot (.github/dependabot.yml) opens
# a PR when a new version or a security rebuild of the same version is
# published; merging it deploys through the usual staging-then-production run.
# The langgenius/* and weaviate images stay on Dify's pins, which move with
# each Dify sync. Each pin is written out in full, not through a YAML anchor,
# so Dependabot can find and update it.

services:
  api:
    build: *prism-api-build
    # host.docker.internal reaches services on the Docker host, such as a
    # host-level Ollama serving the embedding model.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *prism-env
    volumes:
      # Override vector_factory.py to apply local batch-size and batching fixes.
      - ../api/core/rag/datasource/vdb/vector_factory.py:/app/api/core/rag/datasource/vdb/vector_factory.py:ro
      # Prism-branded sign-up and password-reset emails over Dify's own.
      - ./prism/email-templates/register_email_template_en-US.html:/app/api/templates/register_email_template_en-US.html:ro
      - ./prism/email-templates/register_email_when_account_exist_template_en-US.html:/app/api/templates/register_email_when_account_exist_template_en-US.html:ro
      - ./prism/email-templates/reset_password_mail_template_en-US.html:/app/api/templates/reset_password_mail_template_en-US.html:ro
      - ./prism/email-templates/reset_password_mail_when_account_not_exist_no_register_template_en-US.html:/app/api/templates/reset_password_mail_when_account_not_exist_no_register_template_en-US.html:ro
      - ./prism/email-templates/reset_password_mail_when_account_not_exist_template_en-US.html:/app/api/templates/reset_password_mail_when_account_not_exist_template_en-US.html:ro

  worker:
    build: *prism-api-build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *prism-env
    volumes:
      - ../api/core/rag/datasource/vdb/vector_factory.py:/app/api/core/rag/datasource/vdb/vector_factory.py:ro
      - ./prism/email-templates/register_email_template_en-US.html:/app/api/templates/register_email_template_en-US.html:ro
      - ./prism/email-templates/register_email_when_account_exist_template_en-US.html:/app/api/templates/register_email_when_account_exist_template_en-US.html:ro
      - ./prism/email-templates/reset_password_mail_template_en-US.html:/app/api/templates/reset_password_mail_template_en-US.html:ro
      - ./prism/email-templates/reset_password_mail_when_account_not_exist_no_register_template_en-US.html:/app/api/templates/reset_password_mail_when_account_not_exist_no_register_template_en-US.html:ro
      - ./prism/email-templates/reset_password_mail_when_account_not_exist_template_en-US.html:/app/api/templates/reset_password_mail_when_account_not_exist_template_en-US.html:ro

  worker_beat:
    build: *prism-api-build
    environment: *prism-env

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile

  plugin_daemon:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *prism-env
      FORCE_VERIFYING_SIGNATURE: "false"

  ssrf_proxy:
    # ubuntu/squid:latest stopped receiving updates in 2025; the _edge tags
    # get Ubuntu's security rebuilds.
    image: ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Dify's proxy denies private addresses by default; let outbound calls
      # reach services on the Docker host, such as a host-level Ollama.
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-host.docker.internal}

  nginx:
    image: nginx:1.31.10@sha256:a786635fd3c7b9a57ea089ab1c0713e510f3b548b65fe699ce3d59e4a926b37e
    volumes:
      - ./nginx/prism:/etc/nginx/prism:ro

  agent_ssrf_proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506

  certbot:
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d

  db_postgres:
    image: postgres:15.20-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d

  redis:
    image: redis:6.2.24-alpine@sha256:3f9c6e23ed6bea3b41d0ef709fc164c1a0b7c00d5a21a60e0e9c33ada5496881

  weaviate:
    environment:
      DISK_USE_READONLY_PERCENTAGE: ${WEAVIATE_DISK_USE_READONLY_PERCENTAGE:-99}
      DISK_USE_WARNING_PERCENTAGE: ${WEAVIATE_DISK_USE_WARNING_PERCENTAGE:-98}

  # Sidecar for IETF mailing-list and Datatracker access (the ietfdata
  # library needs a newer Python than the API image); reached only on the
  # internal network.
  ietfdata_service:
    build:
      context: ../tools/ietfdata_service
    restart: always
    environment:
      IETFDATA_SQLITE_FILE: /data/ietfdata.sqlite
      IETFDATA_RFC_CACHE_DIR: /data/cache
      IETFDATA_LOGLEVEL: ${IETFDATA_LOGLEVEL:-INFO}
    volumes:
      - ./volumes/ietfdata:/data
